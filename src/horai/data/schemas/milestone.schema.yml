$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:horai:schema:milestone:1
title: Milestone
type: object
additionalProperties: false
required: [_schema, title, stream, status, done_when]
properties:
  _schema: {const: 'horai:milestone@1'}
  title: {type: string, minLength: 1}
  deliverable:
    description: the deliverable that the milestone serves; absent for a milestone that serves its stream directly
    $ref: 'urn:horai:schema:common:1#/$defs/identifier'
  stage:
    description: the stage of its deliverable that the milestone holds; the milestone is then named `<deliverable>-<stage>`
    $ref: 'urn:horai:schema:common:1#/$defs/identifier'
  stream: {$ref: 'urn:horai:schema:common:1#/$defs/stream_id'}
  done_when:
    description: the test that judges completion, or the acceptance by a party
    type: string
    minLength: 1
  status: {enum: [open, done, reduced, stopped]}
  predictability:
    description: routine for a kind of work done several times, exploratory for an open outcome
    enum: [routine, exploratory]
  budget: {$ref: 'urn:horai:schema:common:1#/$defs/duration'}
  estimate: {$ref: 'urn:horai:schema:common:1#/$defs/estimate'}
  cycle: {$ref: 'urn:horai:schema:common:1#/$defs/identifier'}
  rank: {type: integer, minimum: 1}
  origin: {$ref: 'urn:horai:schema:common:1#/$defs/origin'}
  non_negotiable: {$ref: 'urn:horai:schema:common:1#/$defs/date'}
  depends_on:
    type: array
    items: {$ref: 'urn:horai:schema:common:1#/$defs/identifier'}
  consumed_by:
    description: the milestones, or kinds of request, that consume the output of a tooling item
    type: array
    items: {type: string}
  deadline: {$ref: 'urn:horai:schema:common:1#/$defs/deadline'}
  tasks: {$ref: 'urn:horai:schema:common:1#/$defs/tasks'}
dependentRequired:
  stage: [deliverable]
