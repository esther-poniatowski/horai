$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:horai:schema:milestone:1
title: Milestone
type: object
additionalProperties: false
required: [_schema, title, deliverable, stream, kind, status, done]
properties:
  _schema: {const: 'horai:milestone@1'}
  title: {type: string, minLength: 1}
  deliverable: {$ref: 'urn:horai:schema:common:1#/$defs/identifier'}
  stream: {$ref: 'urn:horai:schema:common:1#/$defs/stream_id'}
  kind: {const: milestone}
  done: {type: string, minLength: 1}
  status: {enum: [open, done, reduced, stopped]}
  variance: {enum: [routine, exploratory]}
  budget: {$ref: 'urn:horai:schema:common:1#/$defs/duration'}
  cycle: {$ref: 'urn:horai:schema:common:1#/$defs/identifier'}
  rank: {type: integer, minimum: 1}
  origin: {$ref: 'urn:horai:schema:common:1#/$defs/origin'}
  non_negotiable: {$ref: 'urn:horai:schema:common:1#/$defs/date'}
  depends_on:
    type: array
    items: {$ref: 'urn:horai:schema:common:1#/$defs/identifier'}
  consumers:
    type: array
    items: {type: string}
  deadline: {$ref: 'urn:horai:schema:common:1#/$defs/deadline'}
  tasks: {$ref: 'urn:horai:schema:common:1#/$defs/tasks'}
