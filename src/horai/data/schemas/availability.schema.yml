$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:horai:schema:availability:1
title: Availability
type: object
additionalProperties: false
required: [_schema, capacity, predictable, minimum_block, energy]
properties:
  _schema: {const: 'horai:availability@1'}
  capacity:
    type: object
    additionalProperties: false
    required: [median, low]
    properties:
      median: {$ref: 'urn:horai:schema:common:1#/$defs/duration'}
      low: {$ref: 'urn:horai:schema:common:1#/$defs/duration'}
  predictable: {type: boolean}
  minimum_block: {$ref: 'urn:horai:schema:common:1#/$defs/duration'}
  energy: {type: string}
