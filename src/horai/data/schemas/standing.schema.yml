$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:horai:schema:standing:1
title: Standing parent
type: object
additionalProperties: false
required: [_schema, title, stream]
properties:
  _schema: {const: 'horai:standing@1'}
  title: {type: string, minLength: 1}
  stream: {$ref: 'urn:horai:schema:common:1#/$defs/stream_id'}
  rank: {type: integer, minimum: 1}
  overhead: {type: boolean}
  tasks: {$ref: 'urn:horai:schema:common:1#/$defs/tasks'}
