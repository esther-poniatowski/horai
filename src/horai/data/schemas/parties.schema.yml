$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:horai:schema:parties:1
title: Parties
description: the parties that the agent deals with, each named once
type: object
additionalProperties: false
required: [_schema, parties]
properties:
  _schema: {const: 'horai:parties@1'}
  parties:
    title: Parties
    description: the declared parties, each with an identifier and a name
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          title: Identifier
          description: a slug, unique among the parties, by which records name the party
          $ref: 'urn:horai:schema:common:1#/$defs/identifier'
        name:
          title: Name
          description: the name of the party
          type: string
          minLength: 1
          x-kind: markdown-line
        relations:
          title: Relations
          description: what the party does for the agent or with its results, under the option of external parties
          type: array
          items: {enum: [supplies, delegates, consumes, reviews, imposes, requests]}
        class_of_service:
          title: Class of service
          description: per kind of request of the party, the class of service that replaces that of the profile
          type: object
          propertyNames: {$ref: 'urn:horai:schema:common:1#/$defs/identifier'}
          additionalProperties: {enum: [immediate, scheduled, windowed]}
