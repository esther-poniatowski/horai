$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:horai:schema:cycle:1
title: Cycle
type: object
additionalProperties: false
required: [_schema, start, end]
properties:
  _schema: {const: 'horai:cycle@1'}
  start:
    title: Start
    description: the first date of the cycle
    $ref: 'urn:horai:schema:common:1#/$defs/date'
  end:
    title: End
    description: the last date of the cycle
    $ref: 'urn:horai:schema:common:1#/$defs/date'
  cool_down:
    title: Cool-down
    description: the first and the last dates of the cool-down, which ends the cycle
    type: array
    minItems: 2
    maxItems: 2
    items: {$ref: 'urn:horai:schema:common:1#/$defs/date'}
