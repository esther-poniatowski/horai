$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:horai:schema:week-template:1
title: Week template
type: object
additionalProperties: false
required: [_schema, blocks]
properties:
  _schema: {const: 'horai:week-template@1'}
  blocks: {type: array, items: {$ref: 'urn:horai:schema:common:1#/$defs/block'}}
  windows: {type: array, items: {$ref: 'urn:horai:schema:common:1#/$defs/window'}}
  appointed: {type: array, items: {$ref: 'urn:horai:schema:common:1#/$defs/appointed_block'}}
